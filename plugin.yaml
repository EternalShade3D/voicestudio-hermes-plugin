api_version: 1
config_schema:
  base_url:
    default: http://127.0.0.1:3900
    description: VoiceStudio server base URL
    required: false
    type: str
  debug:
    default: false
    description: Enable debug logging for voice resolution (reads from config dynamically)
    required: false
    type: bool
  engine:
    default: ''
    description: Engine name when the app needs one; empty uses the app's current
      engine
    required: false
    type: str
  release_path:
    default: ''
    description: Optional app path called when the last read-aloud lease is released;
      empty = no-op
    required: false
    type: str
  timeout_s:
    default: 180
    description: Read timeout in seconds for generation calls
    required: false
    type: int
  voice:
    choices:
    - funny
    - EternalMita_Funny_V1
    - Mita_EN_CN_V1
    - Russian Companion
    - EternalMita_V4
    - EternalMita_V3
    - EternalMita_V2
    - '4'
    - '2'
    - ref_en_o2_18s
    - VoiceStudio Demo Voice
    default: EternalMita_V3
    description: Voice for synthesis (id or name; name resolved via /profiles)
    required: false
    type: str
  warm_path:
    default: ''
    description: Optional app path called when read-aloud is turned on (engine preload);
      empty = no-op
    required: false
    type: str
description: 'VoiceStudio TTS provider for Hermes: registers a plugin TTS provider
  named ''voicestudio'' so base_url/voice/engine are settings values. Uses the app''s
  deterministic POST /generate route (not /v1/audio/speech), lists the app''s Saved
  voices through GET /profiles, and calls optional warm/release paths on the read-aloud
  lease (no-op when unset). The ''voice'' field is an enum dropdown built from the
  ''choices'' list below; edit choices when the app''s saved voices change (Hermes
  does not auto-refresh plugin-setting option lists).

  '
license: MIT
manifest_version: 2
name: voicestudio
requires_hermes: '>=0.21'
tags:
- tts
- voice
- audio
version: 1.0.0
