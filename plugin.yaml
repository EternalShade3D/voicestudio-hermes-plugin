name: voicestudio-tts
label: VoiceStudio TTS
version: 1.2.0
manifest_version: 2
api_version: 1
description: 'VoiceStudio TTS provider for Hermes: registers a TTS provider so replies
  can be read aloud with your own local VoiceStudio voices, per profile. Uses the
  app''s POST /generate route and lists saved voices through GET /profiles; /voicestudio
  refresh stores names in plugin state by default. The voice setting is plain text
  unless sync_dropdown is enabled and refresh writes choices for a Settings dropdown.
  Optional warm/release paths fire on the read-aloud lease.
  Sends only reply text to the configured local server (default http://127.0.0.1:3900);
  no credentials, no telemetry, no self-update.'
author: EternalShade3D
license: MIT
homepage: https://github.com/EternalShade3D/voicestudio-hermes-plugin
requires_hermes: '>=0.21'
tags:
- tts
- voice
- audio
provides_tools: []
provides_hooks: []
config_schema:
  base_url:
    default: http://127.0.0.1:3900
    description: VoiceStudio server base URL
    required: false
    type: str
  debug:
    default: false
    description: Enable debug logging for voice resolution (reads from config dynamically)
    required: false
    type: bool
  engine:
    default: ''
    description: Engine name when the app needs one; empty uses the app's current
      engine
    required: false
    type: str
  release_path:
    default: ''
    description: Optional app path called when the last read-aloud lease is released;
      empty = no-op
    required: false
    type: str
  sync_dropdown:
    default: false
    label: Voice list in Settings
    description: 'On: your VoiceStudio voices appear in the voice list in Settings,
      so you pick one with the mouse. The plugin then rewrites its own plugin.yaml,
      so the installed folder shows as changed and an update may have to merge that
      edit. Off (default): the installed folder is never touched and you choose a
      voice with /voicestudio <name>.'
    required: false
    type: bool
  timeout_s:
    default: 180
    description: Read timeout in seconds for generation calls
    required: false
    type: int
  voice:
    default: ''
    description: Voice for synthesis (id or name; name resolved via /profiles)
    required: false
    type: str
  warm_path:
    default: ''
    description: Optional app path called when read-aloud is turned on (engine preload);
      empty = no-op
    required: false
    type: str
